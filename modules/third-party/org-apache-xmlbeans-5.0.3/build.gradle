task jarManifest
task jarPatched(type: Zip)

dependencies {
	compileOnly group: "org.apache.xmlbeans", name: "xmlbeans", transitive: false, version: "5.0.3"
}

jar {
	setActions([])

	dependsOn jarPatched
	finalizedBy jarManifest
}

jarManifest {
	doLast {
		ant.jar(destfile: jar.archivePath, update: true)
	}
}

jarPatched {
	archiveName = jar.archiveName
	destinationDir = jar.destinationDir
	duplicatesStrategy = "exclude"

	exclude "META-INF/versions/9/module-info.class"
	exclude "META-INF/versions/9/org/apache/xmlbeans/impl/tool/MavenPluginResolver.class"

	from sourceSets.main.output

	from {
		zipTree(configurations.compileOnly.singleFile)
	}
}