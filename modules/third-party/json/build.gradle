import com.liferay.gradle.plugins.patcher.PatchTask

apply plugin: "com.liferay.patcher"

task patch(type: PatchTask)

dependencies {
    compile group: "org.json", name: "json", optional, version: "20220320"
}

patch {
    ext {
        autoClean = false
    }

    fileNames "org/jabsorb/serializer/impl/PrimitiveSerializer.java"

    originalLibModuleName = "json"
}