name: Master Sync
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Scheduled Empty Commit Branch']
    types: [completed]
jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    env:
        GITHUB_TOKEN: ${{ secrets.GITHUBPRTOKEN }}
    steps:
      - uses: actions/checkout@v3
      - name: Sync with Master with gh
        run: |
          gh repo sync 
