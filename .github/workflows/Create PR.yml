name: Scheduled Single-Line Change

on:
   workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Adding Difference
        run: awk -v envdate=$(date +%Y-%m-%d) 'BEGIN {print envdate}' > diff.txt
        
      - name: Commit changes
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add diff.txt
          git commit -m "Autogenerated Commit for Upgrade Suite Testing"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: master  
          title: "Upgrade Suite Test"
          body: "This PR is run on a schedule"
          branch: upgrade-test-suite
          labels: Automated, Upgrade Suite Test

      - name: Add comment to Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_number: ${{ github.event.pull_request.number }}  
          body: |  
            ci:test:upgrade

