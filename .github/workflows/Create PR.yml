name: Scheduled Single-Line Change

on:
   workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: List directory contents
        run: |
          ls -la $(pwd)


      - name: Modify README
        run: sed -i 's/This is the original text/New text added on schedule/' ./README.markdown
      - name: Check Status
        run: |
             git status -uno
      - name: Commit changes
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add README.markdown
          git commit -m "Adding scheduled single-line change"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: master  
          title: "Scheduled Single-Line Change"
          body: "This PR has a single line change automatically added at midnight (UTC)."
          branch: scheduled-change
          labels: automated, single-change
