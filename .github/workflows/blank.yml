name: Scheduled Single-Line Change

on:
   workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: List directory contents
        run: |
          ls -la $(pwd)
      - name: Add diff
        run: awk 'BEGIN {print "Autogenerated"}' > diff.txt
      - name: Check Status
        run: |
             git status -uno
      - name: Commit changes

        run: |
          git config user.name 'Jorge Avalos'
          git config user.email 'jorge.avalos@liferay.com'
          git add diff.txt
          git commit -m "Single Line Change"
          git switch -c upgrade-suite-test
          git push origin upgrade-suite-test --force
