name: Create Pull Request and Comment
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Scheduled Empty Commit Branch']  
    types: [completed]  

jobs:
  create-pull-request:  
    runs-on: ubuntu-latest  
    env:                                                
        GITHUB_TOKEN: ${{ secrets.GITHUBPRTOKEN }} 
    steps:
      - uses: actions/checkout@v3  
      - name: Create Pull Request with gh
        run: |  
          gh pr create --title "Autogenerated" --body "ci:test:upgrade" --head refs/heads/upgrade-suite-test --base refs/heads/master
      - name: Add Comment to Pull Test
        run: |  
          gh pr comment upgrade-test-suite --body "ci:test:upgrade"
