name: Create Pull Request and Comment (Force Push)

on: [push]

jobs:
  create-pull-request:
    name: Create Pull Request and Comment (Force Push)  # Moved inside the job definition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create Pull Request
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.issues.createPullRequest({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Your pull request title (e.g., Feature from branch feature)',
              head: context.ref,
              base: 'main',  # Replace 'main' with your target branch for merging
              body: 'Your pull request description (e.g., Description of changes made in feature branch)'
            })
