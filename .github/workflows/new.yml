name: Create Pull Request and Comment (Force Push)

on: [push]


jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create Pull Request  # Use GitHub Script action
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.issues.createPullRequest({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Force Pushed Changes (review recommended)',  # Indicate force push
              head: context.ref,
              base: 'master',  # Replace 'main' with your target branch for merging
              body: 'A force push was detected. Please review changes carefully.'
            })
